<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 保持与原代码相同的结构层级 -->
<div th:if="${categoryMsg}" th:style="'color:' + (${categorySuccess} ? 'green' : 'red')">
    [[${categoryMsg}]]
</div>

<!-- 搜索表单 -->
<form id="categorySearchForm" onsubmit="return handleSearch(event)">
<div class="form-group">
        <label for="searchCategory">搜索分类：</label>
        <input type="text" id="searchCategory" name="searchCategory"
               class="form-control" placeholder="请输入分类名称"
               th:value="${searchCategory}">
        <button type="submit">搜索</button>
    </div>
</form>
<!-- 添加分类表单 -->
<form th:action="@{/api/admin/category/add}" method="post" enctype="application/x-www-form-urlencoded">
    <div class="form-group">
        <label for="categoryName">分类名称：</label>
        <input type="text" id="categoryName" name="categoryName"
               class="form-control" placeholder="请输入分类名称">
        <label for="categoryDesc">分类描述：</label>
        <input type="text" id="categoryDesc" name="categoryDesc"
               class="form-control" placeholder="请输入分类描述">
        <button type="submit" >添加</button>
    </div>
</form>


<h2>分类列表</h2>
<table class="category-table">
    <thead>
    <tr>
        <th>分类ID</th>
        <th>分类名称</th>
        <th>分类描述</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="category : ${pageCategory.list}">
        <td th:text="${category.id}"></td>
        <td th:text="${category.name}"></td>
        <td th:text="${category.description}"></td>
        <td>
            <a href="javascript:void(0)"
               th:data-id="${category.id}"
               th:data-name="${category.name}"
               th:data-desc="${category.description}"
               onclick="showEditModal(this)">修改</a>
            <a href="javascript:void(0)"
               th:data-categoryid="${category.id}"
               th:data-pagenum="${pageCategory.pageNum}"
               onclick="deleteCategory(this)">删除</a>

        </td>
    </tr>
    </tbody>
</table>

<div class="table-container">
    <div style="line-height: 30px;">
        当前第<span class="pageStyle" th:text="${pageCategory.pageNum}"></span>页
        共<span  class="pageStyle" th:text="${pageCategory.pages}"></span>页
        总计<span class="pageStyle" th:text="${pageCategory.total}"></span>条
    </div>

    <div>
        <nav aria-label="Page navigation" class="pull-right">
            <ul class="pagination pagination-sm category-pagination">
                <!-- 首页 -->
                <li>
                    <form onsubmit="return handleCategorySearch(event)">
                        <input type="hidden" name="searchCategory" th:value="${searchCategory}">
                        <input type="hidden" name="pageNum" value="1">
                        <input type="submit" value="首页">
                    </form>
                </li>

                <!-- 上一页 -->
                <li th:if="${pageCategory.pageNum != 1}">
                    <form onsubmit="return handleCategorySearch(event)">
                        <input type="hidden" name="searchCategory" th:value="${searchCategory}">
                        <input type="hidden" name="pageNum" th:value="${pageCategory.pageNum - 1}">
                        <input type="submit" value="上一页">
                    </form>
                </li>

                <!-- 页码 -->
                <li th:each="itemPage : ${#numbers.sequence(1, pageCategory.pages)}"
                    th:class="${pageCategory.pageNum == itemPage} ? 'active'">
                    <form onsubmit="return handleCategorySearch(event)">
                        <input type="hidden" name="searchCategory" th:value="${searchCategory}">
                        <input type="hidden" name="pageNum" th:value="${itemPage}">
                        <input type="submit" th:value="${itemPage}" >
                    </form>
                </li>

                <!-- 下一页 -->
                <li th:if="${pageCategory.pageNum != pageCategory.pages}">
                    <form onsubmit="return handleCategorySearch(event)">
                        <input type="hidden" name="searchCategory" th:value="${searchCategory}">
                        <input type="hidden" name="pageNum" th:value="${pageCategory.pageNum + 1}">
                        <input type="submit" value="下一页">
                    </form>
                </li>

                <!-- 尾页 -->
                <li>
                    <form onsubmit="return handleCategorySearch(event)">
                        <input type="hidden" name="searchCategory" th:value="${searchCategory}">
                        <input type="hidden" name="pageNum" th:value="${pageCategory.pages}">
                        <input type="submit" value="尾页" >
                    </form>
                </li>
            </ul>
        </nav>
    </div>
</div>

<!-- 修改弹窗 -->
<div id="editModal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,0.3);border-radius:5px;">
    <div style="margin-bottom:15px;border-bottom:1px solid #eee;padding-bottom:10px;">
        <h3 style="margin:0;">修改分类</h3>
        <span style="position:absolute;top:10px;right:15px;cursor:pointer;" onclick="closeEditModal()">×</span>
    </div>
    <form id="categoryForm" onsubmit="return handleCategoryUpdate(event)">
        <input type="hidden" name="id" id="editId">
        <input type="hidden" name="pageNum" th:value="${pageCategory?.pageNum ?: 1}">
        <input type="hidden" name="searchCategory" th:value="${searchCategory ?: ''}">
        <div style="margin-bottom:15px;">
            <label>分类名称：</label>
            <input type="text" name="name" id="editName" required
                   style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;">
        </div>
        <div style="margin-bottom:20px;">
            <label>分类描述：</label>
            <input type="text" name="description" id="editDesc"
                   style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;">
        </div>
        <div style="text-align:right;">
            <button type="button" onclick="closeEditModal()"
                    style="padding:6px 12px;background:#95a5a6;color:#fff;border:none;border-radius:3px;margin-right:10px;">
                取消
            </button>
            <button type="submit"
                    style="padding:6px 12px;background:#3498db;color:#fff;border:none;border-radius:3px;">
                保存
            </button>
        </div>
    </form>
</div>
</html>
