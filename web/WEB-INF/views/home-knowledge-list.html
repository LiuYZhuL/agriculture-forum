<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="home-knowledge-list" class="content-section">
    <div class="form-group">
        <label for="ktitle">标题:</label>
        <input type="text" id="ktitle" name="ktitle"
               th:value="${selectK.title}">

        <label for="ksts">状态:</label>
        <select id="ksts" name="kstatus">
            <option value="">全部</option>
            <option value="3" th:selected="${selectK.sts == 3}">未审核</option>
            <option value="4" th:selected="${selectK.sts == 4}">已审核</option>
            <option value="5" th:selected="${selectK.sts == 5}">已删除</option>
        </select>

        <label for="kcategory">分类:</label>
        <select id="kcategory" name="kcategoryId">
            <option value="">全部</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:selected="${selectK.categoryId == category.id}"
                    th:text="${category.name}"></option>
        </select>

        <label for="kisTop">置顶:</label>
        <select id="kisTop" name="kisTop">
            <option value="">全部</option>
            <option value="0" th:selected="${selectK.isTop == 0}">否</option>
            <option value="1" th:selected="${selectK.isTop == 1}">是</option>
        </select>

        <label for="kisEssence">精华:</label>
        <select id="kisEssence" name="kisEssence">
            <option value="">全部</option>
            <option value="0" th:selected="${selectK.isEssence == 0}">否</option>
            <option value="1" th:selected="${selectK.isEssence == 1}">是</option>
        </select>

        <button type="submit" class="btn btn-primary"
                th:onclick="|searchKnowledgePage(1)|">搜索</button>
    </div>

    <!-- 知识表格 -->
    <table class="table">
        <thead>
        <tr>
            <th>知识标题</th>
            <th>分类</th>
            <th>状态</th>
            <th>置顶</th>
            <th>精华</th>
            <th>发布时间</th>
            <th>浏览量</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="knowledge : ${pageK.list}">
            <td th:text="${knowledge.title}"></td>
            <td th:text="${knowledge.category}"></td>
            <td>
                <span th:if="${knowledge.status == 3}" style="color: red;">未审核</span>
                <span th:if="${knowledge.status == 4}" style="color: green;">已审核</span>
                <span th:if="${knowledge.status == 5}" style="color: gray;">待修改</span>
            </td>
            <td>
                <span th:if="${knowledge.isTop == 0}" style="color: red;">否</span>
                <span th:if="${knowledge.isTop == 1}" style="color: green;">是</span>
            </td>
            <td>
                <span th:if="${knowledge.isEssence == 0}" style="color: red;">否</span>
                <span th:if="${knowledge.isEssence == 1}" style="color: green;">是</span>
            </td>
            <td th:text="${#dates.format(knowledge.createTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${knowledge.viewCount}"></td>
            <td>
                <button type="button" class="btn btn-primary"
                        th:onclick="|knowledgeDetail(${knowledge.id})|">详情</button>
                <button type="button" class="btn btn-primary"
                        th:onclick="|editKnowledge(${knowledge.id})|">编辑</button>
                <button type="button" class="btn btn-primary"
                        th:onclick="|deleteKnowledge(${knowledge.id})|">删除</button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 分页导航 -->
    <div class="table-container">
        <div style="line-height: 30px;">
            当前第<span class="pageStyle" th:text="${pageK.pageNum}"></span>页
            共<span class="pageStyle" th:text="${pageK.pages}"></span>页
            总计<span class="pageStyle" th:text="${pageK.total}"></span>条
        </div>
        <div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm">
                    <li>
                        <button type="button" th:onclick="|searchKnowledgePage(1)|">首页</button>
                    </li>
                    <li th:if="${pageK.pageNum != 1}">
                        <button type="button"
                                th:onclick="|searchKnowledgePage(${pageK.pageNum - 1})|">
                            上一页
                        </button>
                    </li>
                    <li th:each="i : ${#numbers.sequence(1, pageK.pages)}">
                        <button type="button"
                                th:onclick="|searchKnowledgePage(${i})|"
                                th:classappend="${pageK.pageNum == i} ? 'active' : ''">
                            <span th:text="${i}"></span>
                        </button>
                    </li>
                    <li th:if="${pageK.pageNum != pageK.pages}">
                        <button type="button"
                                th:onclick="|searchKnowledgePage(${pageK.pageNum + 1})|">
                            下一页
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                th:onclick="|searchKnowledgePage(${pageK.pages})|">
                            尾页
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    <div id="knowledgeEditModal"></div>
</div>
</html>
