<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div id="userMgt" class="content-section">
    <div class="form-group">
        <label for="username">用户名:</label>
        <input type="text" id="username" name="title"
               th:value="${selectUser.username}">
        <label for="email">邮箱：</label>
        <input type="text" id="email" name="email"
               th:value="${selectUser.email}">
        <label for="roleId">角色：</label>
        <select name="roleId" id="roleId">
            <option value="">全部</option>
            <option value="1" th:selected="${selectUser.roleId == 1}">用户</option>
            <option value="2" th:selected="${selectUser.roleId == 2}">管理员</option>
        </select>
        <label for="status">状态：</label>
        <select name="status" id="status">
            <option value="">全部</option>
            <option value="1" th:selected="${selectUser.status == 1}">启用</option>
            <option value="0" th:selected="${selectUser.status == 0}">禁用</option>
        </select>
        <button type="submit" class="btn btn-primary"
                th:onclick="|searchUserPage(1)|">搜索</button>
    </div>
    <h2>用户列表</h2>
    <table class="user-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>密码</th>
            <th>邮箱</th>
            <th>积分</th>
            <th>角色</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>最后登录</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="itemUser : ${pageInfo.list}">
            <td th:text="${itemUser.id}"></td>
            <td th:text="${itemUser.username}"></td>
            <td>
                <button type="button" class="btn btn-default"
                        th:onclick="|resetPassword(${itemUser.id})|">重置密码</button>
            </td>
            <td th:text="${itemUser.email}"></td>
            <td th:text="${itemUser.score}"></td>
            <td>
                <span th:if="${itemUser.roleId == 1}" style="color: green;">用户</span>
                <span th:if="${itemUser.roleId == 2}" style="color: blue;">管理员</span>
            </td>
            <td>
                <span th:if="${itemUser.status==1}" style="color: green;">启用</span>
                <span th:if="${itemUser.status==0}" style="color: red;">禁用</span>
            </td>
            <!-- 创建时间 YYYY-MM-DD HH:mm:ss -->
            <td th:text="${#dates.format(itemUser.createTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${#dates.format(itemUser.lastLoginTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <button  type="button" class="btn btn-primary"
                         th:onclick="|editUser(${itemUser.id})|">编辑</button>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="table-container">
        <div style="line-height: 30px;">
            当前第<span class="pageStyle" th:text="${pageInfo.pageNum}"></span>页
            共<span class="pageStyle" th:text="${pageInfo.pages}"></span>页
            总计<span class="pageStyle" th:text="${pageInfo.total}"></span>条
        </div>
        <div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm">
                    <li>
                        <button type="button" th:onclick="|searchUserPage(1)|">首页</button>
                    </li>
                    <li th:if="${pageInfo.pageNum != 1}">
                        <button type="button"
                                th:onclick="|searchUserPage(${pageInfo.pageNum - 1})|">
                            上一页
                        </button>
                    </li>
                    <li th:each="i : ${#numbers.sequence(1, pageInfo.pages)}">
                        <button type="button"
                                th:onclick="|searchUserPage(${i})|"
                                th:classappend="${pageInfo.pageNum == i} ? 'active' : ''">
                            <span th:text="${i}"></span>
                        </button>
                    </li>
                    <li th:if="${pageInfo.pageNum != pageInfo.pages}">
                        <button type="button"
                                th:onclick="|searchUserPage(${pageInfo.pageNum + 1})|">
                            下一页
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                th:onclick="|searchUserPage(${pageInfo.pages})|">
                            尾页
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    <div id="userEditModal" class="modal">
    </div>
</div>
</html>
