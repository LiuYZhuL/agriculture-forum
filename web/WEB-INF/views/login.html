<!DOCTYPE html>
<meta charset="UTF-8"><html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 使用 Thymeleaf 路径表达式 -->
    <link rel="stylesheet"
          th:href="@{/static/css/login.css}">
    <script th:src="@{/static/js/login.js}"></script>
    <script th:src="@{/static/js/reload.js}"></script>


    <!-- Font Awesome 保持 CDN 引用 -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="container">
    <h1>登录</h1>

    <!-- 错误提示使用 Thymeleaf 条件判断 -->
    <div class="message error" th:if="${error != null}" th:text="${error}"></div>

    <!-- 表单使用 Thymeleaf 绑定 -->
    <form th:action="@{/api/user/login}" method="post">
        <label for="username"><i class="fas fa-user"></i> 用户名:</label>
        <input type="text" id="username" name="username" required
               th:value="${loginUser?.username}">

        <label for="password"><i class="fas fa-lock"></i> 密码:</label>
        <input type="password" id="password" name="password" required
               th:value="${loginUser?.password}"
               pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}"
               title="密码至少一位字母，一位数字，长度至少8位">

        <input type="submit" value="登录">
    </form>

    <!-- 链接使用 Thymeleaf URL 表达式 -->
    <a th:href="@{/api/user/register}" class="action-link">前去注册</a>
    <a th:href="@{/api/user/reset}" class="action-link">忘记密码</a>
</div>


</body>
</html>
