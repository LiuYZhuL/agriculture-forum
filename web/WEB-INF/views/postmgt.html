<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- manage.jsp 帖子管理片段 -->
<div id="postMgt" class="content-section">

    <!-- 搜索表单 -->
    <div class="form-group">
        <label for="user">用户名:</label>
        <input type="text" id="user" th:value="${selectPost.user}">

        <label for="title">标题:</label>
        <input type="text" id="title" th:value="${selectPost.title}">

        <label for="sts">状态:</label>
        <select id="sts">
            <option value="">全部</option>
            <option th:value="0" th:selected="${selectPost.sts == 0}">未审核</option>
            <option th:value="1" th:selected="${selectPost.sts == 1}">已审核</option>
            <option th:value="2" th:selected="${selectPost.sts == 2}">待修改</option>
        </select>
        <label for="isTop">置顶:</label>
        <select id="isTop">
            <option value="">全部</option>
            <option th:value="1" th:selected="${selectPost.isTop == 1}">是</option>
            <option th:value="0" th:selected="${selectPost.isTop == 0}">否</option>
        </select>
        <label for="isEssence">精华:</label>
        <select id="isEssence">
            <option value="">全部</option>
            <option th:value="1" th:selected="${selectPost.isEssence == 1}">是</option>
            <option th:value="0" th:selected="${selectPost.isEssence == 0}">否</option>
        </select>
        <label for="category">分类:</label>
        <select id="category">
            <option value="">全部</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:selected="${selectPost.categoryId == category.id}"
                    th:text="${category.name}"></option>
        </select>

        <button class="btn btn-primary"
                th:onclick="|searchPostPage(1)|">搜索</button>
    </div>

    <!-- 帖子表格 -->
    <table class="table">
        <thead>
        <tr>
            <th>帖子ID</th>
            <th>帖子标题</th>
            <th>作者</th>
            <th>分类</th>
            <th>状态</th>
            <th>状态操作</th>
            <th>置顶</th>
            <th>置顶操作</th>
            <th>精华</th>
            <th>精华操作</th>
            <th>发布时间</th>
            <th>浏览量</th>
            <th>帖子操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${pagePost.list}">
            <td th:text="${post.id}"></td>
            <td th:text="${post.title}"></td>
            <td th:text="${post.username}"></td>
            <td th:text="${post.category}"></td>
            <td>
                    <span th:switch="${post.status}">
                        <span th:case="0" style="color:red">未审核</span>
                        <span th:case="1" style="color:green">已审核</span>
                        <span th:case="2" style="color:gray">待修改</span>
                    </span>
            </td>
            <td>
                <span th:switch="${post.status}">
                    <span th:case="0">
                        <button class="btn-action"
                                th:onclick="|toggleStatus(${post.id},1)|">通过</button>
                        <button class="btn-action"
                                th:onclick="|toggleStatus(${post.id},2)|">打回</button>
                    </span>
                    <span th:case="1">
                        <button class="btn-action"
                                th:onclick="|toggleStatus(${post.id},2)|">打回</button>
                    </span>
                </span>
            </td>
            <td>
                <span th:if="${post.isTop == 1}" style="color:green">✓</span>
                <span th:if="${post.isTop == 0}" style="color:red">✗</span>
            </td>
            <td>
                <span th:switch="${post.isTop}">
                    <span th:case="0">
                        <button class="btn-action"
                                th:onclick="|toggleTop(${post.id},1)|">设为置顶</button>
                    </span>
                    <span th:case="1">
                        <button class="btn-action"
                                th:onclick="|toggleTop(${post.id},0)|">取消置顶</button>
                    </span>
                </span>
            </td>
            <td>
                <span th:if="${post.isEssence == 1}" style="color:green">✓</span>
                <span th:if="${post.isEssence == 0}" style="color:red">✗</span>
            </td>
            <td>
                <span th:switch="${post.isEssence}">
                    <span th:case="0">
                        <button class="btn-action"
                                th:onclick="|toggleEssence(${post.id},1)|">设为精华</button>
                    </span>
                    <span th:case="1">
                        <button class="btn-action"
                                th:onclick="|toggleEssence(${post.id},0)|">取消精华</button>
                    </span>
                </span>
            </td>
            <td>
                <span th:text="${#dates.format(post.createTime,'yyyy-MM-dd HH:mm:ss')}"></span>
            </td>
            <td>
                <span th:text="${post.viewCount}"></span>
            </td>
            <td>
                <button type="button" class="btn btn-primary"
                        th:onclick="|postDetail(${post.id})|">详情</button>
                <button type="button" class="btn btn-primary"
                        th:onclick="|deletePost(${post.id})|">删除</button>
            </td>
        </tr>
        </tbody>
    </table>
    <!-- 分页导航 -->
    <div class="table-container">
        <div style="line-height: 30px;">
            当前第<span class="pageStyle" th:text="${pagePost.pageNum}"></span>页
            共<span class="pageStyle" th:text="${pagePost.pages}"></span>页
            总计<span class="pageStyle" th:text="${pagePost.total}"></span>条
        </div>
        <div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm">
                    <li>
                        <button type="button" th:onclick="|searchPostPage(1)|">首页</button>
                    </li>
                    <li th:if="${pagePost.pageNum != 1}">
                        <button type="button"
                                th:onclick="|searchPostPage(${pagePost.pageNum - 1})|">
                            上一页
                        </button>
                    </li>
                    <li th:each="i : ${#numbers.sequence(1, pagePost.pages)}">
                        <button type="button"
                                th:onclick="|searchPostPage(${i})|"
                                th:classappend="${pagePost.pageNum == i} ? 'active' : ''">
                            <span th:text="${i}"></span>
                        </button>
                    </li>
                    <li th:if="${pagePost.pageNum != pagePost.pages}">
                        <button type="button"
                                th:onclick="|searchPostPage(${pagePost.pageNum + 1})|">
                            下一页
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                th:onclick="|searchPostPage(${pagePost.pages})|">
                            尾页
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</html>
